[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short
markers =
    e2e: End-to-End Tests mit Playwright
    playwright: Alias für e2e
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning